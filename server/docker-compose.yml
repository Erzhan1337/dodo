services:
  postgres:
    image: postgres:16-alpine
    container_name: dodo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dodo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dodo}
      POSTGRES_DB: ${POSTGRES_DB:-dodo}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - dodo_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  dodo_postgres_data:
